name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  macos-minimum-xcode:
    name: macOS · Xcode 15.4 (swift-tools-version 5.9 floor)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos-latest-xcode:
    name: macOS · latest stable Xcode
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios-simulator:
    name: iOS Simulator · latest stable Xcode
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme ConsentBus-Package \
            -destination 'generic/platform=iOS Simulator'
      - name: Test on iOS Simulator
        # Device name may need bumping as Apple rotates the default
        # simulator fleet each year (checked against the runner image's
        # installed simulator list at the time this was written — see
        # actions/runner-images macos-15-Readme.md if this destination
        # stops resolving). A handful of Keychain-dependent persistence
        # tests XCTSkip themselves when running in this bare-test-bundle
        # context, which lacks a host app's Keychain entitlements — that's
        # expected and covered by the macOS jobs above instead, which do
        # exercise real Keychain access.
        run: |
          xcodebuild test \
            -scheme ConsentBus-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16'

  spm-manifest-check:
    name: Validate Package.swift (Swift Package Index requirement)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift package dump-package
        run: swift package dump-package > /dev/null
