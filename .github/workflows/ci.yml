name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  macos-minimum-xcode:
    name: macOS · Xcode 15.4 (swift-tools-version 5.9 floor)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos-latest-xcode:
    name: macOS · latest stable Xcode
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios-simulator:
    name: iOS Simulator · latest stable Xcode
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme ConsentBus-Package \
            -destination 'generic/platform=iOS Simulator'
      - name: Test on iOS Simulator
        # Simulator device names and installed runtimes change with every
        # runner-image update. A hardcoded device name failed the day the
        # default Xcode moved to a release whose iOS runtime wasn't
        # preinstalled (the destination list held only placeholders). So:
        # pick whatever iPhone simulator exists, and download the iOS
        # platform only when there is none.
        #
        # A few Keychain-dependent persistence tests XCTSkip themselves in
        # this bare-test-bundle context, which lacks a host app's Keychain
        # entitlements. That is expected; the macOS jobs above exercise the
        # real Keychain.
        run: |
          pick_simulator() {
            xcrun simctl list devices available | grep 'iPhone' | tail -1 \
              | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' || true
          }
          UDID="$(pick_simulator)"
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator for $(xcodebuild -version | head -1); downloading the iOS platform..."
            xcodebuild -downloadPlatform iOS
            UDID="$(pick_simulator)"
          fi
          [ -n "$UDID" ] || { echo "::error::no iPhone simulator available"; exit 1; }
          echo "Using simulator $UDID"
          xcodebuild test \
            -scheme ConsentBus-Package \
            -destination "platform=iOS Simulator,id=$UDID"

  spm-manifest-check:
    name: Validate Package.swift (Swift Package Index requirement)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift package dump-package
        run: swift package dump-package > /dev/null
